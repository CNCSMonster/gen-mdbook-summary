[package]
name = "gen-mdbook-summary"
version = "0.0.11"
edition = "2024"
authors = ["cncsmonster <cncsmonster@163.com>"]
description = "A tool to generate SUMMARY.md for mdbook project"
license = "MIT"
repository = "https://github.com/cncsmonster/gen-mdbook-summary"

[[bin]]
name = "gms"
path = "src/main.rs"

# 优化二进制文件大小
[profile.release]
opt-level = "z"      # 优化大小而非速度
lto = true           # 链接时优化
codegen-units = 1    # 增加优化机会
panic = "abort"      # 减小 panic 处理代码
strip = "symbols"    # 移除符号表

# 使用更轻量的命令行解析库
[dependencies]
anyhow = "1.0.86"
argh = "0.1"
env_logger = { version = "0.11.3", default-features = false, features = ["auto-color"] }
ignore = "0.4.22"
log = "0.4.21"
